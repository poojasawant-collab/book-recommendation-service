openapi: 3.0.3
info:
  title: Book Recommendation Service
  version: 1.0.0
  description: Recommends books by category, ranked by a weighted (Bayesian) rating.
paths:
  /health:
    get:
      summary: Liveness check
      responses:
        '200': { description: OK }
  /categories:
    get:
      summary: List categories with book counts
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
  /books:
    get:
      summary: List books, optionally filtered by category
      parameters:
        - { name: category, in: query, schema: { type: string } }
      responses:
        '200':
          description: Books
          content:
            application/json:
              schema:
                type: object
                properties:
                  books:
                    type: array
                    items: { $ref: '#/components/schemas/Book' }
        '404': { $ref: '#/components/responses/Error' }
  /books/{id}/ratings:
    post:
      summary: Submit a 1-5 rating for a book
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
      responses:
        '200':
          description: Updated book
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Book' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /recommendations:
    get:
      summary: Top books for a category, best first
      parameters:
        - { name: category, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 5 } }
        - name: exclude
          in: query
          description: Comma-separated book ids to leave out (e.g. already read)
          schema: { type: string }
      responses:
        '200':
          description: Recommendations
          content:
            application/json:
              schema:
                type: object
                properties:
                  category: { type: string }
                  recommendations:
                    type: array
                    items: { $ref: '#/components/schemas/Recommendation' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
components:
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
    Category:
      type: object
      properties:
        name: { type: string }
        bookCount: { type: integer }
    Book:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        author: { type: string }
        category: { type: string }
        year: { type: integer }
        ratingAvg: { type: number }
        ratingCount: { type: integer }
    Recommendation:
      allOf:
        - $ref: '#/components/schemas/Book'
        - type: object
          properties:
            score: { type: number, description: Weighted rating used for ranking }
